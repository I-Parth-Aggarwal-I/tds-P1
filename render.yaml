services:
  - type: web
    name: telegram-data-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AIPIPE_TOKEN
        sync: false
      - key: AIPIPE_BASE_URL
        value: https://aipipe.org/openai/v1
      - key: AIPIPE_MODEL
        value: gpt-4o-mini
      - key: GITHUB_TOKEN
        sync: false
